<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#05090b">
  <title>NIO Control — Novo layout</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#05090b;color:#e8f3f0}
    main{min-height:100vh;display:grid;place-items:center;padding:24px}
    .status{max-width:560px;text-align:center}
    .dot{width:12px;height:12px;display:inline-block;border-radius:50%;background:#00df92;box-shadow:0 0 20px #00df9280;margin-bottom:20px}
    h1{font-size:clamp(32px,6vw,54px);letter-spacing:-.055em;margin:0 0 14px}
    p{font-size:16px;color:#9caca9;line-height:1.65;margin:0}
    small{display:block;color:#617a74;margin-top:24px}
  </style>
</head>
<body>
  <main>
    <section class="status" aria-label="Novo layout em preparação">
      <span class="dot" aria-hidden="true"></span>
      <h1>NIO Control</h1>
      <p>Layout em reconstrução. Esta é a base limpa do projeto, sem o painel antigo.</p>
      <small>Projeto e banco de dados preservados.</small>
    </section>
  </main>
</body>
</html>
